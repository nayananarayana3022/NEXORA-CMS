
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXORA - Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container min-vh-100 d-flex">

    <!-- Branding Section -->
    <div class="brand-section d-none d-md-flex flex-column justify-content-center align-items-center text-center flex-fill">

        <h1 class="brand-name">NEXORA</h1>

        <h3>Join Our Entertainment Community</h3>

        <p>Create. Manage. Publish. Discover.</p>

    </div>


    <!-- Registration Form -->
    <div class="d-flex justify-content-center align-items-center flex-fill p-4">

        <div class="login-card">

            <h2 class="text-center mb-2">Create Account</h2>

            <p class="text-center text-muted mb-4">
                Register to get started with NEXORA
            </p>

            <form id="registerForm">

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <input type="text"
                           id="name"
                           class="form-control"
                           placeholder="Enter your name"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">Email Address</label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           placeholder="Enter your email"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">Password</label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           placeholder="Create a password"
                           minlength="8"
                           required>

                </div>


                <div class="mb-3">

                    <label class="form-label">Confirm Password</label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           placeholder="Confirm your password"
                           required>

                </div>


                <button type="submit"
                        class="btn login-btn w-100">
                    Register
                </button>

                <p id="message" class="text-center mt-3"></p>

            </form>


            <p class="text-center mt-3">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

        </div>

    </div>

</div>

<script src="JS/register.js"></script>

</body>
</html>
