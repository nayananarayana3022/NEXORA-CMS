
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container-fluid login-container">
        <div class="row min-vh-100">

            <!-- Left Side -->
            <div class="col-md-6 brand-section d-flex flex-column justify-content-center align-items-center text-center">
                <h1 class="brand-name">NEXORA</h1>
                <h4>Create. Manage. Publish. Discover.</h4>
                <p>Your intelligent entertainment content management platform.</p>
            </div>

            <!-- Right Side -->
            <div class="col-md-6 d-flex justify-content-center align-items-center">
                <div class="login-card">

                    <h2 class="text-center mb-2">Welcome Back!</h2>
                    <p class="text-center text-muted mb-4">
                        Sign in to your account
                    </p>

                    <form id="loginForm">

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" id="email" class="form-control"
                                placeholder="Enter your email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control"
                                placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn login-btn w-100">
                            Login
                        </button>

                        <p id="message" class="text-center mt-3"></p>

                    </form>

                    <p class="text-center mt-3">
                        Don't have an account?
                        <a href="register.html">Register here</a>
                    </p>

                    <p class="text-center">
                        <a href="public.html">Continue as Visitor</a>
                    </p>

                </div>
            </div>

        </div>
    </div>

    <script src="js/login.js"></script>

</body>
</html>
